<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TED 字幕 · 自动识别（语音转写）</title>
    <link rel="stylesheet" href="asr.css" />
  </head>
  <body>
    <div class="wrap">
      <header class="head">
        <h1><span class="logo">TED</span> 自动识别字幕</h1>
        <div id="meta" class="meta">加载中…</div>
      </header>

      <section class="card">
        <p class="desc">
          从 TED 播放器的纯音频音轨直接抓取整段音频，转码后识别。支持三种方式：
          OpenAI 兼容接口（OpenAI <code>whisper-1</code>、自建 FunASR）、阿里云百炼（本地转发）、
          以及<b>本地 Whisper</b>（浏览器内，仅英文，无需任何服务）。
          识别完成后回到 TED 演讲页即可看到字幕；若已启用 AI 翻译，还会自动补上中文。
        </p>
        <div class="row">
          <button id="start" class="btn primary">开始识别</button>
          <span id="status" class="status"></span>
        </div>
        <pre id="log" class="log"></pre>
      </section>
    </div>

    <script src="mux.min.js"></script>
    <script src="asr.js"></script>
  </body>
</html>
